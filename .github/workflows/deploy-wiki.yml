name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt the JS-based actions into Node 24 ahead of the June 2026 cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5"

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages with "GitHub Actions" as the source on
          # first run, so this workflow self-bootstraps without a manual
          # Settings -> Pages toggle.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
