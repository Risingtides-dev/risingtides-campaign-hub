name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: hub_test
          POSTGRES_DB: hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub_test -d hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql+psycopg2://hub_test:hub_test@localhost:5432/hub_test
        run: python -m pytest
      - name: Run local scraper tests
        run: cargo test --locked --manifest-path tools/yt-scraper/Cargo.toml -- --test-threads=1
